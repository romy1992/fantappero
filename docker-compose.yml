services:
  db:
    image: postgres:16-alpine
    container_name: fantappero-db
    environment:
      POSTGRES_USER: fantappero
      POSTGRES_PASSWORD: fantappero
      POSTGRES_DB: fantappero
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantappero -d fantappero"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: fantappero-backend
    environment:
      DATABASE_URL: postgresql+psycopg://fantappero:fantappero@db:5432/fantappero
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: fastapi dev app/main.py --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
