[project]
name = "fantappero-backend"
version = "0.1.0"
description = "FastAPI backend for the FantAppero MVP."
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.6",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.4"
]

[tool.ruff]
line-length = 100
target-version = "py312"
